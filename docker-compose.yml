# SRSE local development stack.
# One command:  docker compose up   ->  frontend at http://localhost:3000
#
# Brings up: two app containers (frontend, backend) + the local lakehouse
# stand-in (Presto + Hive metastore + MinIO) + DB2 operational store + a
# one-shot synthetic-data seed job.
#
# DATA_MODE=synthetic here. In the client Dev environment use the 'live'
# profile / overrides so the backend points at on-prem Presto + DB2 and the
# presto/metastore/minio/seed services are NOT started.

services:

  # ---------- App: frontend (Next.js 16 / React 19) ----------
  srse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client JS bundle at BUILD time (Next.js NEXT_PUBLIC_*
        # semantics) — set this to the URL the BROWSER will use to reach the
        # backend (not a Docker-internal hostname). Changing it requires a
        # rebuild (`docker compose build srse-frontend`), not just a restart.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      - NEXT_PUBLIC_AUTH_MODE=mock
    depends_on:
      - srse-backend
    restart: unless-stopped

  # ---------- App: backend (Java 17 / Spring Boot 3.x fat-JAR) ----------
  srse-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DATA_MODE=synthetic
      # Operational plane (DB2 / JPA)
      - SRSE_DB2_URL=jdbc:db2://db2:50000/SRSEDB
      - SRSE_DB2_USER=db2inst1
      - SRSE_DB2_PASSWORD=srse_local_pw
      # Analytical plane (PrestoDB / JDBC)
      - SRSE_PRESTO_URL=jdbc:presto://presto:8080/iceberg/srse
      - SRSE_PRESTO_USER=srse
      - SRSE_PRESTO_PASSWORD=${SRSE_PRESTO_PASSWORD:-}
      - SRSE_PRESTO_SSL=${SRSE_PRESTO_SSL:-false}
      - SRSE_PRESTO_TRUSTSTORE_PATH=${SRSE_PRESTO_TRUSTSTORE_PATH:-}
      - SRSE_PRESTO_TRUSTSTORE_PASSWORD=${SRSE_PRESTO_TRUSTSTORE_PASSWORD:-}
      # Auth
      - SRSE_AUTH_MODE=mock
      # CORS — must match the URL the BROWSER loads the frontend from.
      # Comma-separated if you need more than one (e.g. http + https).
      - SRSE_FRONTEND_ORIGINS=${SRSE_FRONTEND_ORIGINS:-http://localhost:3000}
      # Guardrails
      - SRSE_COHORT_CAP=1000
      - SRSE_QUERY_TIMEOUT_SECONDS=30
      - SRSE_ANALYSIS_ROW_CAP=1000
      # Admin-editable connection overrides (Tab 2) — persisted here so an
      # admin edit survives container recreation, not just a restart.
      - SRSE_CONNECTION_OVERRIDE_PATH=/app/config/connection-overrides.properties
    volumes:
      - connection-overrides:/app/config
    depends_on:
      db2:
        condition: service_started
      presto:
        condition: service_started
    restart: unless-stopped

  # ---------- Operational store: DB2 ----------
  db2:
    image: icr.io/db2_community/db2:11.5.8.0
    # Required for Apple Silicon local dev (image has no arm64 build; QEMU).
    # First-boot under emulation may be considerably slower than the note below.
    platform: linux/amd64
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - LICENSE=accept
      - DB2INST1_PASSWORD=srse_local_pw
      - DBNAME=SRSEDB
      - ARCHIVE_LOGS=false
    volumes:
      - db2data:/database
    # NOTE: DB2 community image is heavy and slow to first-boot (minutes).
    # If laptop resources are tight, a lighter operational store can be
    # substituted for local dev ONLY (keep DB2 for parity in client Dev).

  # ---------- Lakehouse stand-in: MinIO (object storage) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # Host ports remapped off 9000/9001 to avoid clashing with other
      # projects' MinIO containers on this machine; internal container-to-
      # container traffic (Presto's hive.s3.endpoint=http://minio:9000 in
      # docker/presto/catalog/iceberg.properties) is unaffected — that uses
      # the container's own port 9000 over the docker network, not this
      # host-side mapping.
      - "9010:9000"
      - "9011:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data

  # ---------- Lakehouse stand-in: Hive metastore (for Iceberg) ----------
  metastore:
    image: apache/hive:3.1.3
    command: hive --service metastore
    ports:
      - "9083:9083"
    environment:
      - SERVICE_NAME=metastore
    depends_on:
      - minio

  # ---------- Lakehouse stand-in: PrestoDB 0.297 ----------
  presto:
    image: prestodb/presto:0.297
    ports:
      - "8081:8080"   # host 8081 -> presto 8080 (backend uses internal 8080)
    volumes:
      - ./docker/presto/catalog:/opt/presto-server/etc/catalog:ro
      # Image default is -Xmx1G, which OOMs on ordinary batch inserts/scans
      # against this box's 19.5GB Docker allocation goes mostly unused —
      # override to 4G so local seeding/querying doesn't crash mid-run.
      - ./docker/presto/jvm.config:/opt/presto-server/etc/jvm.config:ro
    depends_on:
      - metastore
      - minio

  # ---------- One-shot: generate synthetic data as Iceberg tables ----------
  seed:
    build:
      context: ./docker/seed
      dockerfile: Dockerfile
    environment:
      - PRESTO_URL=jdbc:presto://presto:8080/iceberg/srse
      - ROWS=200000
    depends_on:
      - presto
    restart: "no"

volumes:
  db2data:
  miniodata:
  connection-overrides:
