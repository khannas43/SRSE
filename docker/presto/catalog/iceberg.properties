# Local PrestoDB Iceberg catalog, backed by the Hive metastore and MinIO.
# Mirrors the client watsonx.data topology (Iceberg tables on object storage)
# so the SQL the compiler emits locally is identical to what runs in Dev.

connector.name=iceberg
hive.metastore.uri=thrift://metastore:9083

# MinIO (S3-compatible) storage
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

iceberg.catalog.type=hive
