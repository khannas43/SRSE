# Second Iceberg catalog — exists so the LOCAL stack can exercise the
# multi-catalog paths that the client deployment relies on (Silver and Gold
# layers live in different catalogs there). Without a second catalog, nothing
# locally can prove a cross-catalog join actually executes.
#
# Shares the metastore and MinIO with `iceberg`: the point is to give Presto
# two distinct CATALOG handles, not two storage backends. Schema and table
# names are kept deliberately different from the `iceberg` catalog's so a
# qualified reference cannot accidentally resolve against the wrong one.
connector.name=iceberg
hive.metastore.uri=thrift://metastore:9083

hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

iceberg.catalog.type=hive
