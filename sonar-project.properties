sonar.projectKey=SRSE
sonar.projectName=SRSE

# Sources: Java backend + TS/React frontend
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test

# Java analysis requires compiled classes
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Coverage from JaCoCo (backend tests)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Exclude build artifacts, nested clone, docs binaries, Docker seed cache
sonar.exclusions=**/target/**,**/node_modules/**,**/.next/**,**/SRSE/**,docs/**,docker/**,**/*.pdf
sonar.test.exclusions=backend/src/test/**
